<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture Controlled 3D Particles</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.8);
            pointer-events: none;
            z-index: 10;
        }
        h1 { margin: 0; font-size: 1.5rem; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; }
        .status { font-size: 0.9rem; color: #00ffcc; margin-top: 5px; }
        .instruction { font-size: 0.8rem; margin-top: 15px; line-height: 1.6; color: #aaa; }
        .key { color: #fff; font-weight: bold; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; }
        #video-feed {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 160px;
            height: 120px;
            border-radius: 8px;
            opacity: 0.5;
            transform: scaleX(-1); /* Mirror feedback */
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 5;
        }
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 1.2rem;
            text-align: center;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1>Kinetic Particles</h1>
        <div class="status" id="status-text">Initializing AI...</div>
        <div class="instruction">
            <div><span class="key">Move Hand</span> Rotate Camera</div>
            <div><span class="key">Pinch</span> Expand / Explode</div>
            <div style="margin-top:8px; border-top:1px solid #333; padding-top:8px;">
                <div><span class="key">✊ Fist</span> Cloud</div>
                <div><span class="key">✌️ 2 Fingers</span> Heart</div>
                <div><span class="key">🤟 3 Fingers</span> Flower</div>
                <div><span class="key">🖖 4 Fingers</span> Saturn</div>
                <div><span class="key">🖐 5 Fingers</span> Fireworks</div>
            </div>
        </div>
    </div>

    <div id="loading">Loading Computer Vision Models...<br><span style="font-size:0.8rem; color:#888;">Please allow camera access</span></div>
    
    <video id="video-feed" playsinline></video>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script type="x-shader/x-vertex" id="vertexshader">
        uniform float uTime;
        uniform float uMixFactor;
        uniform float uSize;
        uniform float uPinch;
        
        attribute vec3 positionTarget; // The target shape position
        attribute float aRandom;
        
        varying vec3 vColor;
        varying float vAlpha;

        // Color palette based on shape
        vec3 getShapeColor(float id) {
            if(id < 0.5) return vec3(0.1, 0.8, 0.9); // Cloud: Cyan
            if(id < 1.5) return vec3(1.0, 0.1, 0.3); // Heart: Red
            if(id < 2.5) return vec3(1.0, 0.5, 0.0); // Flower: Orange
            if(id < 3.5) return vec3(0.8, 0.7, 0.4); // Saturn: Beige
            return vec3(0.5, 0.2, 1.0);              // Firework: Purple
        }

        void main() {
            // Morphing logic: Interpolate between current position (attribute 0) and target
            // Note: In a full GPGPU system we'd simulate physics, here we interpolate attributes.
            // For simplicity in this demo, 'position' is our base and 'positionTarget' is our destination.
            // We actually handle morphing in JS to keep the shader simple, 
            // but we use the shader for the "Pinch" explosion effect.

            vec3 pos = position;
            
            // Explosion effect based on Pinch (uPinch 0.0 to 1.0)
            // Push particles outward from center based on pinch intensity
            float explosion = uPinch * 5.0 * (1.0 + aRandom);
            pos = pos + normalize(pos) * explosion;

            // Noise movement
            pos.x += sin(uTime * 2.0 + pos.y) * 0.05;
            pos.y += cos(uTime * 1.5 + pos.x) * 0.05;

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            
            // Size attenuation
            gl_PointSize = (uSize * 400.0) / -mvPosition.z;
            gl_Position = projectionMatrix * mvPosition;

            // Pass color to fragment
            vColor = vec3(1.0); 
            vAlpha = 1.0 - uPinch * 0.5; // Fade out slightly on explode
        }
    </script>

    <script type="x-shader/x-fragment" id="fragmentshader">
        uniform vec3 uColor;
        varying vec3 vColor;
        varying float vAlpha;

        void main() {
            // Circular particle drawing
            vec2 xy = gl_PointCoord.xy - vec2(0.5);
            float ll = length(xy);
            if(ll > 0.5) discard;

            // Soft glow edge
            float strength = 1.0 - (ll * 2.0);
            strength = pow(strength, 1.5);

            gl_FragColor = vec4(uColor, strength * vAlpha);
        }
    </script>

    <script>
        // --- CONFIGURATION ---
        const PARTICLE_COUNT = 15000;
        const PARTICLE_SIZE = 0.15;
        
        let scene, camera, renderer, particles;
        let uniforms;
        
        // Morph Targets (Buffers)
        const shapes = {
            cloud: [],
            heart: [],
            flower: [],
            saturn: [],
            fireworks: []
        };
        
        // State
        const state = {
            currentShape: 'cloud',
            targetShapeIndex: 0,
            rotation: { x: 0, y: 0 },
            pinchStrength: 0,
            fingerCount: 0
        };

        const shapeNames = ['cloud', 'heart', 'flower', 'saturn', 'fireworks'];
        const colors = [
            new THREE.Color(0x00ffff), // Cyan
            new THREE.Color(0xff0055), // Red
            new THREE.Color(0xffaa00), // Orange
            new THREE.Color(0xe0c090), // Saturn Ring
            new THREE.Color(0xaa55ff)  // Purple
        ];

        // --- INIT THREE.JS ---
        function init() {
            const container = document.body;

            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.02);

            // Camera
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.z = 15;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Generate Shapes
            generateShapes();

            // Create Particle System
            createParticleSystem();

            // Resize Event
            window.addEventListener('resize', onWindowResize, false);

            // Start Loop
            animate();
        }

        // --- GEOMETRY GENERATION ---
        function generateShapes() {
            const range = 4;
            
            // 1. Cloud / Sphere
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const r = range * Math.cbrt(Math.random());
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                shapes.cloud.push(
                    r * Math.sin(phi) * Math.cos(theta),
                    r * Math.sin(phi) * Math.sin(theta),
                    r * Math.cos(phi)
                );
            }

            // 2. Heart
            // x = 16sin^3(t)
            // y = 13cos(t) - 5cos(2t) - 2cos(3t) - cos(4t)
            // z = variational thickness
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const t = Math.random() * Math.PI * 2;
                const r = Math.random(); // volume filler
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                const z = (Math.random() - 0.5) * 5; 
                // Scale down
                const s = 0.25;
                shapes.heart.push(x * s, y * s, z);
            }

            // 3. Flower (Rose curve + Spherical modulation)
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                const k = 4; // petals
                const r = range * (0.3 + 0.7 * Math.abs(Math.cos(k * theta) * Math.sin(phi)));
                shapes.flower.push(
                    r * Math.sin(phi) * Math.cos(theta),
                    r * Math.sin(phi) * Math.sin(theta),
                    r * Math.cos(phi) * 0.5 // flatten z
                );
            }

            // 4. Saturn
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                // 70% in ring, 30% in planet
                if (Math.random() > 0.3) {
                    // Ring
                    const angle = Math.random() * Math.PI * 2;
                    const r = 5 + Math.random() * 3; // radius 5 to 8
                    shapes.saturn.push(
                        r * Math.cos(angle),
                        (Math.random()-0.5) * 0.2, // thin disk
                        r * Math.sin(angle)
                    );
                } else {
                    // Planet
                    const r = 2.5 * Math.cbrt(Math.random());
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    shapes.saturn.push(
                        r * Math.sin(phi) * Math.cos(theta),
                        r * Math.sin(phi) * Math.sin(theta),
                        r * Math.cos(phi)
                    );
                }
            }

            // 5. Fireworks (Starburst)
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                // Concentrate on lines from center
                const line = Math.floor(Math.random() * 20); // 20 streams
                // Perturb slightly
                const perturbedTheta = theta + (Math.random()-0.5)*0.1;
                const perturbedPhi = phi + (Math.random()-0.5)*0.1;
                const r = Math.random() * 8; // large radius
                shapes.fireworks.push(
                    r * Math.sin(perturbedPhi) * Math.cos(perturbedTheta),
                    r * Math.sin(perturbedPhi) * Math.sin(perturbedTheta),
                    r * Math.cos(perturbedPhi)
                );
            }
        }

        function createParticleSystem() {
            const geometry = new THREE.BufferGeometry();
            
            // Set initial positions (Cloud)
            const positions = new Float32Array(shapes.cloud);
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            // Randoms for shimmer
            const randoms = new Float32Array(PARTICLE_COUNT);
            for(let i=0; i<PARTICLE_COUNT; i++) randoms[i] = Math.random();
            geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));

            // Uniforms
            uniforms = {
                uTime: { value: 0 },
                uColor: { value: new THREE.Color(0x00ffff) },
                uSize: { value: PARTICLE_SIZE },
                uPinch: { value: 0 }
            };

            const material = new THREE.ShaderMaterial({
                uniforms: uniforms,
                vertexShader: document.getElementById('vertexshader').textContent,
                fragmentShader: document.getElementById('fragmentshader').textContent,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now() * 0.001;
            uniforms.uTime.value = time;
            uniforms.uPinch.value = state.pinchStrength;

            // Smooth Color Transition
            const targetColor = colors[state.targetShapeIndex];
            particles.material.uniforms.uColor.value.lerp(targetColor, 0.05);

            // Smooth Rotation (controlled by hand)
            particles.rotation.x += (state.rotation.x - particles.rotation.x) * 0.1;
            particles.rotation.y += (state.rotation.y - particles.rotation.y) * 0.1;
            
            // Continuous Idle Rotation
            particles.rotation.y += 0.002;

            // Morphing Logic (CPU Side for simplicity of template management)
            // We smoothly interpolate the 'position' attribute buffer towards the target shape buffer
            const positions = particles.geometry.attributes.position.array;
            const targetShapeName = shapeNames[state.targetShapeIndex];
            const targetPositions = shapes[targetShapeName];

            let diff = 0;
            // Morph speed
            const speed = 0.08; 
            
            // Only update if we aren't perfectly aligned (Optimization)
            for (let i = 0; i < positions.length; i++) {
                const current = positions[i];
                const target = targetPositions[i];
                const d = (target - current) * speed;
                positions[i] += d;
            }
            particles.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- MEDIAPIPE LOGIC ---
        const videoElement = document.getElementById('video-feed');
        const statusElement = document.getElementById('status-text');
        const loadingElement = document.getElementById('loading');

        function onResults(results) {
            loadingElement.style.opacity = 0; // Hide loading text on first result

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                statusElement.innerText = "Tracking Hand...";
                statusElement.style.color = "#00ffcc";

                // 1. Calculate Pinch (Thumb Tip 4 vs Index Tip 8)
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];
                const distance = Math.sqrt(
                    Math.pow(thumbTip.x - indexTip.x, 2) +
                    Math.pow(thumbTip.y - indexTip.y, 2)
                );
                
                // Map distance: close (0.02) -> 0 pinch, far (0.2) -> 1 pinch? 
                // Actually, pinch usually means close.
                // Let's invert: Distance < 0.05 is pinch.
                // But for "Expansion", user might want to spread fingers.
                // Let's use Index Finger Extended status + Spread for "Size".
                // Simplify: "Pinch" (Index+Thumb touching) = EXPLOSION / EXPANSION max
                
                // Map: 0.15 (open) to 0.02 (closed). 
                // We want Close = 0, Open = 1? Or Close = Explode?
                // Let's make Pinch (Close) = 0 scale, Open = 1 scale. 
                // But the prompt says "Pinch... controls expansion". 
                // Let's map the distance directly to an "Explosion" factor.
                // If fingers are touching (dist < 0.05), Factor = 0.
                // If fingers are wide (dist > 0.2), Factor = 1.
                // Let's create an "Activity" factor based on hand openness.
                
                // Better interaction: Pinch to COMPRESS, Release to EXPLODE.
                // Let's just map pinch distance to uPinch.
                // 0.0 (touching) -> uPinch = 1.0 (Explode/Scatter).
                // > 0.15 (open) -> uPinch = 0.0 (Normal).
                let pinch = 1.0 - (Math.min(Math.max(distance, 0.02), 0.15) - 0.02) / (0.13);
                state.pinchStrength = pinch; // 1.0 when touching, 0.0 when open

                // 2. Hand Position -> Rotation
                // x: 0 (left) -> 1 (right). Map to -1 to 1
                // y: 0 (top) -> 1 (bottom).
                const x = (landmarks[9].x - 0.5) * 2; // Middle finger knuckle as center
                const y = (landmarks[9].y - 0.5) * 2;
                state.rotation.x = y * 0.5;
                state.rotation.y = x * 0.5;

                // 3. Count Fingers (Shape Switching)
                // Tips: 8, 12, 16, 20. Thumb: 4.
                // Check if tip is higher (y is smaller) than PIP joint (y).
                let count = 0;
                // Index
                if (landmarks[8].y < landmarks[6].y) count++;
                // Middle
                if (landmarks[12].y < landmarks[10].y) count++;
                // Ring
                if (landmarks[16].y < landmarks[14].y) count++;
                // Pinky
                if (landmarks[20].y < landmarks[18].y) count++;
                // Thumb (check x distance relative to wrist for left/right agnostic? simpler: just check x vs ip)
                // Simple vertical check for thumb often fails. Let's stick to 4 fingers + thumb logic if needed.
                // Let's use a simpler heuristic for thumb: is it extended away from palm?
                // For this demo, we'll count the 4 fingers reliably.
                if (distance > 0.05) { // If pinch is open, count thumb as 1 roughly
                     // Or just map 0-4 fingers.
                }
                
                // Explicit Mapping:
                // 0 fingers extended (Fist) -> Cloud (0)
                // 1 finger? -> Cloud
                // 2 fingers (Peace) -> Heart (1)
                // 3 fingers -> Flower (2)
                // 4 fingers -> Saturn (3)
                // 5 fingers (Open Palm) -> Fireworks (4)
                
                // Adjust count including thumb roughly (if thumb tip is far from index base)
                // Simple hack: if count is 4 and thumb is far, make it 5.
                if (count === 4) {
                    // Check thumb
                    if (Math.abs(landmarks[4].x - landmarks[17].x) > 0.15) count = 5;
                }

                // Map count to shape
                if (count <= 1) state.targetShapeIndex = 0; // Cloud
                else if (count === 2) state.targetShapeIndex = 1; // Heart
                else if (count === 3) state.targetShapeIndex = 2; // Flower
                else if (count === 4) state.targetShapeIndex = 3; // Saturn
                else if (count >= 5) state.targetShapeIndex = 4; // Firework

            } else {
                statusElement.innerText = "No hand detected";
                statusElement.style.color = "#ff3333";
                state.pinchStrength = 0;
            }
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        const cameraFeed = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 320,
            height: 240
        });

        // Initialize
        init();
        cameraFeed.start();

    </script>
</body>
</html>
